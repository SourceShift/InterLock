# The landing page at https://interlock.sourceshift.ai/ -- a second, one-page
# Zensical build beside the manual's (zensical.toml).
#
# Why two builds: Zensical puts a page's URL where its source file sits under
# docs_dir, and the manual's sources live in docs/ at the repository root,
# where the README, CONTRIBUTING and the issue templates all link into them.
# Serving the manual at /docs/ therefore roots its build at /docs/, and a
# build rooted there cannot emit a page at /. This file roots a build at /
# whose only page is the landing, writes it to site/, and the manual's build
# then writes into site/docs/ beside it. Build order matters: this one first,
# because it owns site/.
#
#   zensical serve -f zensical.landing.toml   # preview at http://localhost:8000/
#   zensical build -f zensical.landing.toml   # write site/
#
# In the preview the links into the manual lead nowhere, because the manual
# is the other build; on the host they resolve.
#
# What is here mirrors zensical.toml where the theme needs it on this page
# (palette, fonts, favicon, Markdown extensions, so the prose renders the
# same) and omits what a single page cannot use: nav, search, and the
# instant-navigation features, which would otherwise try to swap the manual's
# pages into the landing's chrome. The landing's own structure lives in
# overrides/main.html, gated on `extra.landing` below.

[project]
site_name = "interlock"
site_url = "https://interlock.sourceshift.ai/"
site_description = "In-process guardrails for AI agents: block or rewrite a tool, MCP, or model call before it runs."
site_author = "SourceShift"
copyright = "Apache-2.0 &middot; SourceShift"
repo_url = "https://github.com/SourceShift/InterLock"
repo_name = "SourceShift/InterLock"
edit_uri = "edit/main/landing/"
docs_dir = "landing"
# The root of the deployed directory. Everything in landing/ that is not
# Markdown is copied here too: _redirects, which Pages reads only from the
# root, and robots.txt, which points at both sitemaps.
site_dir = "site"

# The landing page's stylesheet is injected from overrides/main.html, not
# listed here; see the note on extra_css in zensical.toml.
extra_css = []

[project.extra]
# The switch overrides/main.html reads to render the landing page's own
# header, hero, proof block and footer in place of the theme's chrome. The
# manual's build does not set it, so the override leaves every manual page
# on the stock theme.
landing = true

[project.theme]
language = "en"
# Same drawing as the manual's favicon, docs/assets/images/favicon.svg. A copy
# rather than a reference, because a build can only ship files under its own
# docs_dir; if the drawing changes, change both.
favicon = "assets/images/favicon.svg"
custom_dir = "overrides"
# Off for the same reason as in zensical.toml: the theme's Google Fonts request
# would be a second one. The landing page makes its own, reviewed, in
# overrides/main.html.
font = false
features = []

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "green"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "green"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Mirrors zensical.toml, so the prose renders exactly as it would there.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
