# Site configuration for the manual at interlock.sourceshift.ai/docs/
#
# Built by Zensical (https://zensical.org), the successor to Material for
# MkDocs. The Markdown under docs/ is the same source that renders on GitHub --
# nothing here rewrites it, so a page must read correctly in both places.
#
#   zensical serve      # preview at http://localhost:8000/docs/
#   zensical build      # write site/docs/
#
# The manual lives under /docs/, not at the host's root. `site_url` carries
# that path and `site_dir` mirrors it, so the local site/ tree has the same
# shape as the deployed host: site/ is what Cloudflare Pages serves, and
# site/docs/ is this manual. The host root is the landing page: a separate
# one-page build from zensical.landing.toml, which owns site/ and explains
# why there are two builds. The pre-move page URLs redirect into /docs/ via
# landing/_redirects.
#
# CI runs both builds and deploys site/ to Cloudflare Pages; see
# .github/workflows/docs.yml.

[project]
site_name = "interlock"
# The manual's base path. Page links are relative and unaffected, but the
# canonical URL, the sitemap and the 404 page's absolute asset paths all
# derive from this, so it ends in /docs/ with the trailing slash.
site_url = "https://interlock.sourceshift.ai/docs/"
# Mirrors the path in site_url. The landing build (zensical.landing.toml)
# writes the root of site/ and must run first; this build then writes into
# site/docs/ beside it and touches nothing above.
site_dir = "site/docs"
site_description = "In-process guardrails for AI agents: block or rewrite a tool, MCP, or model call before it runs."
site_author = "SourceShift"
copyright = "Apache-2.0 &middot; SourceShift"
repo_url = "https://github.com/SourceShift/InterLock"
repo_name = "SourceShift/InterLock"
edit_uri = "edit/main/docs/"

# Stylesheets are injected per page from overrides/main.html rather than listed
# here, and that is deliberate. There are two of them and they must never load
# together:
#
#   * docs/assets/stylesheets/landing.css -- the system font stack (see
#     `font = false` below) and the docs pages' green accent. Every page of
#     the manual.
#
#   * landing/assets/stylesheets/home.css -- the landing page's design port.
#     The landing page only; it ships with the landing build
#     (zensical.landing.toml), not with this one.
#
# The reason is that both sheets define the same `--il-*` token names, and
# landing.css declares its copy under `[data-md-color-scheme="default"]`, which
# Zensical sets on <body>. A declaration on the element itself beats anything
# inherited from :root, so with both loaded landing.css would quietly win every
# `var(--il-*)` on the page -- --il-dim, --il-allow, --il-rewrite and --il-block
# would all resolve to the old light palette while the amber --acc (which only
# home.css defines) stayed correct, which is a confusing half-broken look.
#
# Keep this list empty. Adding a sheet here makes it global and reintroduces
# exactly that collision.
extra_css = []

# Zoom and fullscreen for the Mermaid diagrams: a toolbar, Ctrl/Cmd-wheel and
# pinch zoom, drag to pan, and a fullscreen view. Dependency-free. Its
# stylesheet is linked from overrides/main.html; see the note there.
extra_javascript = ["assets/javascripts/diagram.js"]

nav = [
  # The landing page is not a page of this build: it is zensical.landing.toml's
  # one page at the host root, so the link out is absolute.
  { "Home" = "https://interlock.sourceshift.ai/" },
  # The manual's own index, at /docs/. The README, CONTRIBUTING and the issue
  # templates all point readers here for "which page do I want".
  { "Overview" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Concepts" = "concepts.md" },
  { "Security model" = "security-model.md" },
  { "Guides" = [
    { "Writing rules" = "guides/writing-rules.md" },
    { "Declarative policies" = "guides/policies.md" },
    { "Using detectors" = "guides/detectors.md" },
    { "Integrations" = "guides/integrations.md" },
    { "Coding agents" = "guides/coding-agents.md" },
    { "MCP" = "guides/mcp.md" },
    { "Databases and APIs" = "guides/databases.md" },
    { "Approvals" = "guides/approvals.md" },
    { "Review queue" = "guides/reviews.md" },
    { "Credentials" = "guides/credentials.md" },
    { "Scopes" = "guides/scopes.md" },
    { "Audit log" = "guides/audit-log.md" },
    { "Console" = "guides/console.md" },
    { "Sandbox" = "guides/sandbox.md" },
    { "Mesh" = "guides/mesh.md" },
    { "Mesh root ceremony" = "guides/mesh-root-ceremony.md" },
    { "Production checklist" = "guides/production.md" },
  ] },
  { "Reference" = [
    { "Python API" = "reference/python-api.md" },
    { "Command line" = "reference/cli.md" },
    { "Detector catalog" = "reference/detectors.md" },
    { "Sidecar" = "reference/sidecar.md" },
  ] },
  # These live outside docs/, so they go to the repository rather than being
  # built into the site.
  { "Roadmap" = "https://github.com/SourceShift/InterLock/blob/main/ROADMAP.md" },
  { "Changelog" = "https://github.com/SourceShift/InterLock/blob/main/CHANGELOG.md" },
  { "Contributing" = "https://github.com/SourceShift/InterLock/blob/main/CONTRIBUTING.md" },
]

[project.theme]
language = "en"

# The tab icon, and the same file overrides/main.html renders as the nav's
# mark, so the two are one asset rather than two drawings that drift. Pointing
# the theme at the SVG is deliberate: the theme otherwise emits its own default
# <link rel="icon" href="assets/images/favicon.png">, and a second link added
# alongside it would leave the browser to pick, which is a coin flip rather
# than a decision. See docs/assets/images/favicon.svg.
favicon = "assets/images/favicon.svg"

# Theme overrides. Currently just the landing page; see overrides/main.html.
custom_dir = "overrides"

# Turns off the theme's webfonts. Out of the box the theme emits
#   <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter...">
# on every page, which sends each visitor's IP to Google -- on the docs site of a
# library whose pitch is "no account, no network calls, works offline". The stack
# in docs/assets/stylesheets/landing.css fills the gap for zero bytes.
font = false

features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
# Sober chrome, so the only colour on the page is the verdict triad.
# landing.css pins the accent to the "allow" green per scheme.
primary = "black"
accent = "green"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "green"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/SourceShift/InterLock"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
