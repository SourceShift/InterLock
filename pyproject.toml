[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interlock-guard"
version = "0.0.1"
description = "In-process guardrails for AI agents: hook tool/MCP/model calls and block or modify a bad action before it runs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Amir Khakshour" }]
keywords = [
    "ai",
    "agents",
    "guardrails",
    "agent-security",
    "llm-security",
    "prompt-injection",
    "mcp",
    "security",
    "runtime",
    "policy",
    "policy-as-code",
    "tool-call",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://interlock.sourceshift.ai/"
Documentation = "https://interlock.sourceshift.ai/docs/"
Repository = "https://github.com/SourceShift/InterLock"
Issues = "https://github.com/SourceShift/InterLock/issues"
Changelog = "https://github.com/SourceShift/InterLock/blob/main/CHANGELOG.md"
Security = "https://github.com/SourceShift/InterLock/blob/main/SECURITY.md"

[project.optional-dependencies]
mcp = ["wrapt>=1.15"]
langchain = ["langchain-core>=0.3,<1.8"]
# The control plane's server, driver and signing primitives. Nothing in the
# core package imports these; `import interlock.cloud` stays dependency-free.
cloud = ["uvicorn>=0.30", "psycopg[binary]>=3.1", "cryptography>=42", "webauthn>=2.0"]
# ruff is pinned here too: CI pins it (an unpinned linter turns a green repo red
# on a release schedule), and a contributor should run the same version as CI.
dev = ["pytest>=7", "langchain-core>=0.3,<1.8", "ruff==0.17.2",
       # scripts/check_site.py reads the Zensical TOML; tomllib is 3.11+
       "tomli>=1.1; python_version < '3.11'"]

[project.scripts]
interlock = "interlock.cli:main"
interlock-sidecar = "interlock.sidecar.__main__:main"
interlock-console = "interlock.console.__main__:main"

[tool.setuptools.packages.find]
include = ["interlock*"]

[tool.setuptools.package-data]
# PEP 561: ships the inline type hints to type checkers and IDEs.
interlock = ["py.typed"]
# The vendored VDAF code carries its own licence; a wheel that drops it
# distributes the code without the notice it was taken under.
"interlock.mesh.vdaf" = ["LICENSE.md"]
# The migration runner reads its SQL from the installed package. `*.sql` covers
# a file beside the module; `sql/*.sql` is the one that reaches the subdirectory
# (setuptools globs do not cross `/`).
"interlock.cloud" = ["*.sql", "sql/*.sql"]
